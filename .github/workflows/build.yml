name: Build UDI Scan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Use official Gradle distribution (CI outside CN)
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip#services.gradle.org/distributions/gradle-8.14.3-all.zip#' gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release (公开直链)
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          tag: debug-latest
          name: UDI 扫码盘点 App (debug) 最新版
          body: "自动构建的最新 debug 版（Kotlin + zxing-android-embedded + 自写 GS1 解析 + NMPA 正向查询）。"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
