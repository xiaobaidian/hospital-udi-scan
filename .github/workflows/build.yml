name: Build UDI Scan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Use official Gradle distribution (CI outside CN)
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip#services.gradle.org/distributions/gradle-8.14.3-all.zip#' gradle/wrapper/gradle-wrapper.properties

      - name: Compute version (递增 versionCode)
        id: ver
        run: |
          # 以仓库提交总数作为 versionCode（单调递增），保证每次覆盖安装版号变化
          VC=$(git rev-list --count HEAD)
          dateShort=$(date +%y)$(date +%m)$(date +%d)
          VN="0.1.${VC}"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "computed VC=$VC VN=$VN"

      - name: Build debug APK (capture log)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ steps.ver.outputs.versionCode }} -PversionName="${{ steps.ver.outputs.versionName }}" > /tmp/build.log 2>&1

      - name: Upload build log for diagnosis (commit comment)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; sha=os.environ['SHA']
          log=open('/tmp/build.log','rb').read().decode('utf-8','ignore')
          if len(log)>30000: log=log[-30000:]
          url=f"https://api.github.com/repos/{repo}/commits/{sha}/comments"
          data={"body":"BUILD LOG (tail):\n\n```\n"+log+"\n```"}
          req=urllib.request.Request(url,data=json.dumps(data).encode(),method="POST")
          req.add_header("Authorization",f"token {token}"); req.add_header("User-Agent","x"); req.add_header("Content-Type","application/json")
          try:
              with urllib.request.urlopen(req,timeout=30) as r: print("commented",r.status)
          except urllib.error.HTTPError as e: print("comment err",e.code,e.read()[:300])
          PY

      - name: Upload APK artifact (Actions)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release (公开直链)
        if: success()
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          tag: debug-latest
          name: UDI 扫码盘点 App (debug) 最新版
          body: "自动构建的最新 debug 版（Kotlin + zxing-android-embedded + 自写 GS1 解析 + NMPA 正向查询）。"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
