apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hospital.udiscan'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hospital.udiscan'
        minSdk 24
        targetSdk 36
        // 本地未注入时给默认值；CI 会通过 -P 注入递增后的版本号
        def vc = (project.findProperty('versionCode') ?: '1').toString().toInteger()
        def vn = project.findProperty('versionName') ?: '0.1.0'
        versionCode vc
        versionName vn.toString()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // 固定签名密钥：保证每次 CI 构建用同一密钥，可覆盖安装
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.p12')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    // 左右滑动页面容器（扫码页 / 清单页）
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    // 条码扫码（zxing-android-embedded，AndroidX 版、不依赖 GMS，普通 Android 机可用）
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
