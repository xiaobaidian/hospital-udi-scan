apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hospital.udiscan'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hospital.udiscan'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // 固定签名密钥：保证每次 CI 构建用同一密钥，可覆盖安装
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.p12')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    // 条码扫码（zxing-android-embedded，不依赖 GMS，普通 Android 机可用）
    implementation 'com.journeyapps:zxing-android-embedded:2.3.0'
}
